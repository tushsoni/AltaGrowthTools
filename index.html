<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alta Growth Tools</title>
<style>
  :root {
    --ink: #10202e;
    --ink-soft: #1b3145;
    --paper: #eef2f5;
    --muted: #8fa6b8;
    --signal: #ffc247;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 8vh 6vw;
    line-height: 1.5;
  }

  .rule {
    width: 64px;
    height: 3px;
    background: var(--signal);
    margin-bottom: 2.5rem;
  }

  h1 {
    font-size: clamp(2.5rem, 9vw, 5.5rem);
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1.02;
    margin: 0 0 1.25rem;
    max-width: 12ch;
  }

  p {
    margin: 0;
    max-width: 52ch;
    color: var(--muted);
    font-size: clamp(1rem, 2.2vw, 1.125rem);
  }

  footer {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--ink-soft);
    color: var(--muted);
    font-size: 0.8125rem;
    max-width: 52ch;
  }
</style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Alta Growth Tools</h1>
    <p>Placeholder page. Tools and dashboards will be linked here.</p>
  </main>
  <footer>Altametrics Growth Team</footer>
</body>
</html>
